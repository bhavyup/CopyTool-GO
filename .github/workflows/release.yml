name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -buildvcs=false

jobs:
  build:
    name: Package (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit_short="${GITHUB_SHA::7}"

          target="copytool_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          stage_root="$(mktemp -d)"
          stage_dir="${stage_root}/${target}"
          mkdir -p dist
          mkdir -p "$stage_dir"

          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi

          binary_name="copytool_${version}_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          binary_path="dist/${binary_name}"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${commit_short} -X main.buildDate=${build_date}" \
              -o "${stage_dir}/copytool${ext}" \
              ./cmd/copytool

          cp "${stage_dir}/copytool${ext}" "${binary_path}"

          cp README.md "$stage_dir/README.md"
          if [ -f LICENSE ]; then
            cp LICENSE "$stage_dir/LICENSE"
          fi

          if [ "${{ matrix.goos }}" = "windows" ]; then
            archive="dist/${target}.zip"
            (cd "$stage_root" && zip -q -r "$GITHUB_WORKSPACE/${archive}" "${target}")
          else
            archive="dist/${target}.tar.gz"
            tar -C "$stage_root" -czf "$archive" "$target"
          fi

          rm -rf "$stage_root"

          echo "binary=$binary_path" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.binary }}
          retention-days: 7

  installer:
    name: Build installer (windows/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          out="dist/copytool-installer_${version}_windows_${{ matrix.goarch }}.exe"

          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
              -ldflags "-s -w -X main.defaultRepo=bhavyup/CopyTool-GO" \
              -o "$out" \
              ./cmd/copytool-installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-installer-windows-${{ matrix.goarch }}
          path: dist/copytool-installer_*_windows_${{ matrix.goarch }}.exe
          retention-days: 7

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - installer
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum dist/* > dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
