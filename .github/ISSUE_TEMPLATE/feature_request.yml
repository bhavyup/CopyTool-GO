name: Feature request
description: Propose an enhancement
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Suggest a focused improvement with clear user value.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line summary of the requested feature
      placeholder: Add JSON export mode for machine-readable output
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe expected behavior, flags, UI/UX, and edge cases
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, references, etc.
