name: Bug report
description: Report a defect or regression
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CopyTool. Please provide enough detail to reproduce the issue.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug
      placeholder: Export fails with include-ext filter
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, and CopyTool version
      placeholder: Windows 11, PowerShell 7, copytool v1.2.3
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps and input paths/flags when possible
      placeholder: |
        1. Run `copytool -cli -root ...`
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste console output, stack traces, or screenshots
      render: text
